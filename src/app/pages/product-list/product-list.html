<section class="produtos">
  <div class="produtos-titulo">
    <div>
      <span class="subtitulo">CATÁLOGO</span>
      <h2>{{ categoriaAtual || 'Todos os produtos' }}</h2>
    </div>
  </div>

  <div class="lista-produtos">
    @for (item of produtosFiltrados; track item.nome) {
      <div class="produto" (click)="abrirDetalhes(item)">
        <img [src]="item.imagem" [alt]="item.nome">

        <div class="produto-info">
          <h3>{{ item.nome }}</h3>
          <p class="preco">{{ item.preco }}</p>
          <span class="pagamento">{{ item.pagamento }}</span>
        </div>
      </div>
    }
  </div>
</section>

@if (produtoSelecionado) {
  <app-produto [produto]="produtoSelecionado" (fechar)="fecharDetalhes()"></app-produto>
}
