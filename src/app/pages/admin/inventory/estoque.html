<section class="estoque">
  <div class="estoque-titulo">
    <span class="subtitulo">ESTOQUE</span>
    <h2>Produtos</h2>
  </div>

  <div class="caixa">
    <h3>Adicionar novo produto</h3>
    <div class="formulario">
      <input [(ngModel)]="form.nome" placeholder="Nome do produto" />
      <select [(ngModel)]="form.categoria">
        @for (c of categorias; track c) { <option [value]="c">{{ c }}</option> }
      </select>
      <input type="number" [(ngModel)]="form.preco" placeholder="Preço (R$)" min="0" step="0.01" />
      <input type="number" [(ngModel)]="form.estoque" placeholder="Estoque" min="0" />
      <button class="botao-adicionar" (click)="adicionar()">Adicionar</button>
      <input class="campo-largo" [(ngModel)]="form.imagem" placeholder="Link da imagem (opcional)" />
      <input class="campo-largo" [(ngModel)]="form.descricao" placeholder="Descrição (opcional)" />
    </div>
  </div>

  <div class="caixa">
    <h3>Produtos cadastrados ({{ service.produtos().length }})</h3>

    <div class="tabela-area">
      <table>
        <thead>
          <tr>
            <th>NOME</th>
            <th>CATEGORIA</th>
            <th>PREÇO</th>
            <th>ESTOQUE</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (p of service.produtos(); track p.id) {
            <tr>
              <td>{{ p.nome }}</td>
              <td class="categoria">{{ p.categoria }}</td>
              <td class="preco">{{ p.preco | currency:'BRL' }}</td>
              <td>{{ p.estoque }}</td>
              <td>
                <button class="botao-remover" (click)="remover(p.id, p.nome)">Remover</button>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="5" class="vazio">Nenhum produto cadastrado.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
