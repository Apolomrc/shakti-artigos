@if (!noAdmin) {
  <app-header (abrirLogin)="abrirAutenticacao()"></app-header>
}

@if (mostrarAutenticacao && !noAdmin) {
  <app-cadastro [modoLogin]="true" (fechar)="fecharAutenticacao()"></app-cadastro>
}

<router-outlet></router-outlet>

@if (cart.aberto()) {
  <app-cart></app-cart>
}

@if (mostrarTopo() && !noAdmin) {
  <button type="button" class="voltar-topo" (click)="subirAoTopo()" aria-label="Voltar ao topo">↑ Topo</button>
}

@if (!noAdmin) {
  <app-footer></app-footer>
}
